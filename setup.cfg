# Formatting configuration for autopep8 and isort.
#
# This pins the options both tools run with, so "formatted correctly" has
# one objective answer regardless of which machine (a contributor's laptop
# or the `lint` CI job) runs them, and so the two tools don't fight each
# other's output.
#
# autopep8 auto-discovers this file's [pycodestyle] section (no flags
# needed -- see `autopep8 --help`'s `--ignore-local-config`, which is off
# by default). isort auto-discovers its own [isort] section the same way.

[pycodestyle]
max-line-length = 100
exclude = build

[isort]
# 100 to match max-line-length above, rather than isort's own default (79):
# a wrapped multi-name `from x import (...)` block that autopep8 considers
# fine (under 100 cols) would otherwise still get unnecessarily wrapped by
# isort at 79, for no reason both tools would agree on.
line_length = 100
# Vertical Hanging Indent (one name per line, trailing comma, closing paren
# on its own line) is fully PEP 8-legal on its own -- autopep8 has nothing
# to "fix" about it afterwards, unlike isort's own default GRID mode, which
# packs names onto the continuation line in a way that occasionally lands
# on a column autopep8 then wants to re-align (E127/E128). This combination
# (multi_line_output=3 + include_trailing_comma + force_grid_wrap=0 +
# use_parentheses) is the same recipe commonly used to make isort agree
# with Black -- adopted here for the same reason (it's simply PEP
# 8-stable), not because this project uses Black.
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
# Without this, isort's own local-package auto-detection can be thrown off
# depending on which directory it's invoked from; being explicit keeps
# `repo_size_guardian`/`tests` imports grouped after stdlib/third-party
# regardless of invocation directory.
known_first_party = repo_size_guardian,tests
skip = build
