name: 'Repo Size Guardian'
description: 'A GitHub action to prevent large or unwanted files from entering repository history via PRs'
author: 'Yuan-Ming Hsu'

inputs:
  max_text_size_kb:
    description: 'Maximum size for text files in KB'
    required: false
  max_binary_size_kb:
    description: 'Maximum size for binary files in KB'
    required: false
  policy_path:
    description: 'Path to policy configuration file'
    required: false
    default: '.github/repo-size-guardian.yml'
  fail_on:
    description: 'Minimum severity that causes job failure (warn|error)'
    required: false
    default: 'error'
  scan_mode:
    description: 'Scan mode (history|diff)'
    required: false
    default: 'history'
  dedupe_blobs:
    description: 'Deduplicate blob evaluation'
    required: false
    default: 'true'
  annotate_pr:
    description: 'Add PR annotations for violations'
    required: false
    default: 'true'
  max_annotations:
    description: 'Maximum number of GitHub annotations to emit (0 = unlimited)'
    required: false
    default: '50'
  base_ref:
    description: 'Explicit base ref/SHA to diff from (overrides auto-detection)'
    required: false
  head_ref:
    description: 'Explicit head ref/SHA to diff to (overrides auto-detection)'
    required: false

outputs:
  violations_found:
    description: 'Number of violations found'
    value: ${{ steps.scan.outputs.violations_found }}
  summary:
    description: 'Summary of scan results'
    value: ${{ steps.scan.outputs.summary }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Run repo-size-guardian
      id: scan
      shell: bash
      run: |
        cd ${{ github.action_path }}
        pip install -e .
        args=(
          --policy-path "${{ inputs.policy_path }}"
          --fail-on "${{ inputs.fail_on }}"
          --scan-mode "${{ inputs.scan_mode }}"
          --dedupe-blobs "${{ inputs.dedupe_blobs }}"
          --annotate-pr "${{ inputs.annotate_pr }}"
          --max-annotations "${{ inputs.max_annotations }}"
        )
        if [ -n "${{ inputs.max_text_size_kb }}" ]; then
          args+=(--max-text-size-kb "${{ inputs.max_text_size_kb }}")
        fi
        if [ -n "${{ inputs.max_binary_size_kb }}" ]; then
          args+=(--max-binary-size-kb "${{ inputs.max_binary_size_kb }}")
        fi
        if [ -n "${{ inputs.base_ref }}" ]; then
          args+=(--base-ref "${{ inputs.base_ref }}")
        fi
        if [ -n "${{ inputs.head_ref }}" ]; then
          args+=(--head-ref "${{ inputs.head_ref }}")
        fi
        cd "${GITHUB_WORKSPACE}"
        python -m repo_size_guardian "${args[@]}"

branding:
  icon: 'shield'
  color: 'blue'