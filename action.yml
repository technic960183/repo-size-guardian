name: 'Repo Size Guardian'
description: "Blocks large or disallowed files from entering your repo's Git history via PRs, not just the final diff."
author: 'Yuan-Ming Hsu'

inputs:
  max_text_size_kb:
    description: 'Maximum size for text files in KB'
    required: false
  max_binary_size_kb:
    description: 'Maximum size for binary files in KB'
    required: false
  policy_path:
    description: 'Path to policy configuration file'
    required: false
    default: '.github/repo-size-guardian.yml'
  fail_on:
    description: 'Minimum severity that causes job failure (warn|error)'
    required: false
    default: 'error'
  scan_mode:
    description: 'Scan mode (history|diff)'
    required: false
    default: 'history'
  dedupe_blobs:
    description: 'Deduplicate blob evaluation'
    required: false
    default: 'true'
  annotate_pr:
    description: 'Add PR annotations for violations'
    required: false
    default: 'true'
  max_annotations:
    description: >-
      Maximum number of GitHub annotations to emit (0 = unlimited). GitHub
      itself caps annotations per step to 10 warnings + 10 errors + 10
      notices regardless of this setting; the job summary is not subject
      to that cap and always lists every violation.
    required: false
    default: '10'
  base_ref:
    description: 'Explicit base ref/SHA to diff from (overrides auto-detection)'
    required: false
  head_ref:
    description: 'Explicit head ref/SHA to diff to (overrides auto-detection)'
    required: false

outputs:
  violations_found:
    description: 'Number of violations found'
    value: ${{ steps.scan.outputs.violations_found }}
  summary:
    description: 'Summary of scan results'
    value: ${{ steps.scan.outputs.summary }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Run repo-size-guardian
      id: scan
      shell: bash
      # Inputs are passed through the environment, never interpolated into
      # the script body. A `${{ inputs.x }}` expression is substituted into
      # the script *before* bash parses it, so an input carrying shell
      # metacharacters would be executed -- and `base_ref`/`head_ref` are
      # routinely wired to `github.head_ref`, which on a fork PR is an
      # attacker-chosen branch name (git allows `$`, backticks, quotes and
      # `;` in ref names).
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_MAX_TEXT_SIZE_KB: ${{ inputs.max_text_size_kb }}
        INPUT_MAX_BINARY_SIZE_KB: ${{ inputs.max_binary_size_kb }}
        INPUT_POLICY_PATH: ${{ inputs.policy_path }}
        INPUT_FAIL_ON: ${{ inputs.fail_on }}
        INPUT_SCAN_MODE: ${{ inputs.scan_mode }}
        INPUT_DEDUPE_BLOBS: ${{ inputs.dedupe_blobs }}
        INPUT_ANNOTATE_PR: ${{ inputs.annotate_pr }}
        INPUT_MAX_ANNOTATIONS: ${{ inputs.max_annotations }}
        INPUT_BASE_REF: ${{ inputs.base_ref }}
        INPUT_HEAD_REF: ${{ inputs.head_ref }}
        # Keep the *consumer's* working directory off sys.path: we run from
        # ${GITHUB_WORKSPACE}, and without this a repository that happens to
        # contain a `yaml.py`/`yaml/` or `repo_size_guardian/` entry would
        # shadow our own imports. Ignored by Python < 3.11.
        PYTHONSAFEPATH: '1'
      run: |
        set -euo pipefail

        # --retries/--timeout make the install resilient to transient PyPI
        # hiccups instead of failing the whole job on a blip.
        python -m pip install --quiet --disable-pip-version-check \
          --retries 5 --timeout 30 "${ACTION_PATH}"

        # Every input is optional at this level: an input that is absent, or
        # explicitly set to an empty string, falls back to the CLI's own
        # default rather than being passed through as "".
        args=()
        add_arg() {
          if [ -n "$2" ]; then
            args+=("$1" "$2")
          fi
        }
        add_arg --policy-path "${INPUT_POLICY_PATH:-}"
        add_arg --fail-on "${INPUT_FAIL_ON:-}"
        add_arg --scan-mode "${INPUT_SCAN_MODE:-}"
        add_arg --dedupe-blobs "${INPUT_DEDUPE_BLOBS:-}"
        add_arg --annotate-pr "${INPUT_ANNOTATE_PR:-}"
        add_arg --max-annotations "${INPUT_MAX_ANNOTATIONS:-}"
        add_arg --max-text-size-kb "${INPUT_MAX_TEXT_SIZE_KB:-}"
        add_arg --max-binary-size-kb "${INPUT_MAX_BINARY_SIZE_KB:-}"
        add_arg --base-ref "${INPUT_BASE_REF:-}"
        add_arg --head-ref "${INPUT_HEAD_REF:-}"

        # Scan the consumer's repository, not this action's own checkout.
        cd "${GITHUB_WORKSPACE}"
        # ${args[@]+...} keeps `set -u` happy if every input was empty.
        python -m repo_size_guardian ${args[@]+"${args[@]}"}

branding:
  icon: 'shield'
  color: 'blue'
